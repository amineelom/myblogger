{% comment %} BlogPosting + Breadcrumb structured data for posts. {% endcomment %}
{% assign post_image = page.image | default: site.image | absolute_url %}
{% assign post_desc = page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 300 %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ post_desc | jsonify }},
  "image": {{ post_image | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": { "@type": "Person", "name": {{ page.author | default: site.author | jsonify }} },
  "publisher": {
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "logo": { "@type": "ImageObject", "url": {{ site.logo | absolute_url | jsonify }} }
  },
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ '/' | absolute_url }}" },
    { "@type": "ListItem", "position": 2, "name": "Articles", "item": "{{ '/articles/' | absolute_url }}" },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
  ]
}
</script>
