title: "MarkeReviews"
tagline: "Affiliate tech & tools"
author: MarkeReviews Team
email: amineelom203@gmail.com
description: "Honest reviews, comparisons, and tutorials."
url: "https://markereviews.com"
baseurl: ""
permalink: /:title/
markdown: kramdown
timezone: Africa/Casablanca

# jekyll-seo-tag inputs: default social/SEO image + twitter card style.
# Individual posts can override with an `image:` field in their front matter.
logo: /assets/images/default-monochrome-black.svg
image: /assets/images/og-default.png
twitter:
  card: summary_large_image
social:
  name: MarkeReviews
  links:
    - https://markereviews.com

# Enable safe, GitHub-Pages-friendly plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-minifier
  - jekyll-redirect-from

include:
  - f23529503e774ad79005911ed314be91.txt

# Keep post.md as a copy-paste template for new articles, but don't build it
# into a thin /post/ page.
exclude:
  - post.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bundle

# Navigation (you can add/remove items)
nav:
  - title: Home
    url: /
  - title: Articles
    url: /articles/
  - title: Tags
    url: /tags/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/
  - title: Disclosure
    url: /disclosure/
  - title: Privacy
    url: /privacy/

# Collections or defaults (assign default layout + default social image
# so jekyll-seo-tag emits og:image / twitter image on every page;
# individual posts can override `image:` in their own front matter).
defaults:
  - scope: {path: ""}
    values:
      layout: default
      image: /assets/images/og-default.png
  - scope: {path: "", type: posts}
    values:
      layout: post
      image: /assets/images/og-default.png
    
# Minifier settings
minifier:
  compress_js: true
  compress_css: true
  compress_json: true
  remove_comments: true

# Auto internal linking (_plugins/internal_links.rb). Links the first mention
# of another post's topic phrase to that post, with anti-spam guardrails.
auto_internal_links:
  enabled: true
  max_per_page: 4    # cap links injected per post
  min_words: 2       # ignore single-word anchors
  min_chars: 10      # ignore very short anchors

# Build output
sass:
  style: compressed
